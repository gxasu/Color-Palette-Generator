  <link rel="stylesheet" href="css/styles.css" />

<body>
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">
        <i data-feather="droplet" class="logo-icon" aria-hidden="true"></i>
        Color Scale Generator
      </h1>
    </div>
    <div class="header-right">
      <div class="collection-name-wrapper">
        <input type="text" id="collection-name" value="カラーパレット" class="md-input" placeholder=" " />
        <label for="collection-name">コレクション</label>
      </div>
      <div class="header-actions">
        <md-filled-tonal-button id="import-btn" title="JSONインポート">
          <span slot="icon" class="button-icon-slot" aria-hidden="true">
            <i data-feather="upload" class="button-icon" aria-hidden="true"></i>
          </span>
          インポート
        </md-filled-tonal-button>
        <input type="file" id="import-file" accept=".json" hidden />
        <md-filled-tonal-button id="export-btn" title="JSONエクスポート">
          <span slot="icon" class="button-icon-slot" aria-hidden="true">
            <i data-feather="download" class="button-icon" aria-hidden="true"></i>
          </span>
          エクスポート
        </md-filled-tonal-button>
        <div class="theme-menu" id="theme-menu">
          <button
            type="button"
            id="theme-trigger"
            class="header-icon-btn"
            title="テーマを切り替え"
            aria-label="テーマを切り替え"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="theme-actions"
          >
            <span class="button-icon-slot" id="theme-trigger-icon" aria-hidden="true">
              <i data-feather="sun" class="button-icon" aria-hidden="true"></i>
            </span>
          </button>
          <div class="panel-dropdown-menu header-dropdown-menu" id="theme-actions" hidden aria-label="テーマ切り替え" role="menu">
            <button type="button" class="panel-dropdown-item theme-option" data-theme-value="light" role="menuitemradio" aria-checked="false">
              <span class="panel-dropdown-item-icon" aria-hidden="true">
                <i data-feather="sun" class="button-icon" aria-hidden="true"></i>
              </span>
              <span>ライト</span>
            </button>
            <button type="button" class="panel-dropdown-item theme-option" data-theme-value="dark" role="menuitemradio" aria-checked="false">
              <span class="panel-dropdown-item-icon" aria-hidden="true">
                <i data-feather="moon" class="button-icon" aria-hidden="true"></i>
              </span>
              <span>ダーク</span>
            </button>
            <button type="button" class="panel-dropdown-item theme-option" data-theme-value="system" role="menuitemradio" aria-checked="false">
              <span class="panel-dropdown-item-icon" aria-hidden="true">
                <i data-feather="monitor" class="button-icon" aria-hidden="true"></i>
              </span>
              <span>システム</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main">
    <!-- 左パネル: パレット一覧 -->
    <aside class="panel-left" aria-label="パレット一覧">
      <div class="panel-header">
        <span class="title-small">パレット一覧</span>
        <div class="panel-header-actions">
          <div class="panel-add-menu" id="add-palette-menu">
            <button type="button" id="add-palette-trigger" class="panel-add-btn" title="パレットを追加" aria-label="パレットを追加" aria-haspopup="true" aria-expanded="false" aria-controls="add-palette-actions">
              <i data-feather="plus" class="button-icon" aria-hidden="true"></i>
            </button>
            <div class="panel-dropdown-menu" id="add-palette-actions" hidden aria-label="パレット追加メニュー">
              <button type="button" id="add-palette-btn" class="panel-dropdown-item">
                <span class="panel-dropdown-item-icon" aria-hidden="true">
                  <i data-feather="grid" class="button-icon" aria-hidden="true"></i>
                </span>
                <span>通常パレットを追加</span>
              </button>
              <button type="button" id="add-alpha-palette-btn" class="panel-dropdown-item">
                <span class="panel-dropdown-item-icon" aria-hidden="true">
                  <i data-feather="droplet" class="button-icon" aria-hidden="true"></i>
                </span>
                <span>Alpha パレットを追加</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="palette-list" id="palette-cards" role="listbox" aria-label="パレット一覧"></div>
    </aside>

    <!-- 中央パネル: スウォッチ・チャート・コントラスト -->
    <section class="panel-center" id="panel-center" aria-label="カラースウォッチ・チャート・コントラスト">
      <div class="empty-state">
        <i data-feather="grid" class="empty-icon" aria-hidden="true"></i>
        <p>パレットを選択するか、新しく作成してください。</p>
      </div>
    </section>

    <!-- 右パネル: プロパティ -->
    <aside class="panel-right" id="panel-right" aria-label="プロパティ">
      <div class="empty-state">
        <i data-feather="sliders" class="empty-icon" aria-hidden="true"></i>
        <p>パレットを選択してください。</p>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
